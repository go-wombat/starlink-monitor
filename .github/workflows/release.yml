name: Release IPK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run package
      - name: Create SHA-256 checksum
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          artifact="gl-sdk4-ui-starlink-monitor_${package_version}_all.ipk"
          test -f "dist/$artifact"
          cd dist
          sha256sum "$artifact" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/gl-sdk4-ui-starlink-monitor_*_all.ipk
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Starlink Monitor $GITHUB_REF_NAME"
